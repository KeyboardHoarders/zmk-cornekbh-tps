# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# sleep settings
# currently set to 30 mins
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

CONFIG_ZMK_KEYBOARD_NAME="CorneKBH"
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_POINTING=y

# Trackpad (Azoteq TPS43, right half) support. The driver itself
# (CONFIG_INPUT_TPS43 / CONFIG_I2C) is only needed on the half the
# trackpad is physically wired to - see corne_right.conf.
#
# The trackpad's input-processing thread needs more stack than the
# default; both halves get this since input-split events flow through
# the central side too.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7
